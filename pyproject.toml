[project]
name = "resume-v2"
version = "0.1.0"
description = "Local, evidence-based resume preparation with Typst"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "PyMuPDF>=1.25,<2", "typst>=0.14,<1"]

[project.scripts]
resume-tool = "resume_tool.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resume_tool"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "resume_tool/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
